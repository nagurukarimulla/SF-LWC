<template>
    <lightning-card
        title="GraphQL Contact Pagination"
        icon-name="standard:contact">

        <div class="slds-p-around_medium">

            <template if:true={contactList}>

                <p class="slds-text-heading_small slds-m-bottom_medium">
                    Page Number: {pageNumber}
                </p>

                <template for:each={contactList} for:item="contact">

                    <div key={contact.node.Id}
                         class="slds-box slds-m-bottom_small">

                        <p>
                            <strong>Name: </strong>
                            {contact.node.Name.value}
                        </p>

                        <p>
                            <strong>Email: </strong>
                            {contact.node.Email.value}
                        </p>

                    </div>

                </template>

                <div class="slds-m-top_medium">

                    <lightning-button
                        label="Reset"
                        onclick={handleReset}
                        disabled={isFirstPage}
                        class="slds-m-right_small">
                    </lightning-button>

                    <lightning-button
                        label="Next"
                        variant="brand"
                        onclick={handleNext}
                        disabled={isLastPage}>
                    </lightning-button>

                </div>

            </template>

            <template if:true={contacts.errors}>
                <div class="slds-text-color_error">
                    Error loading contacts
                </div>
            </template>

        </div>

    </lightning-card>
</template>
