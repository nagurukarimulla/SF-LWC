<template>

    <lightning-card
        title="Remove Event Listeners"
        icon-name="utility:close">

        <div class="slds-p-around_medium">

            <p>Press any key to trigger the global event listener.</p>

            <div class="slds-m-top_medium">

                <strong>Last Key Pressed: </strong>{lastKey}

            </div>
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="destructive"
                    label="Remove component"
                    onclick={removeSelf}>
                </lightning-button>
            </div>
        </div>

    </lightning-card>

</template>
