<template>
    <lightning-card title="Enterprise Record Form Suite" icon-name="utility:form">

      <div class="slds-p-around_medium">
    <!-- Two columns side by side -->
    <div class="slds-grid slds-gutters">
        <!-- First column - Object Selector -->
        <div class="slds-col slds-size_1-of-2">
            <lightning-combobox
                name="objectSelector"
                label="Select Object"
                value={objectApiName}
                placeholder="Select Object"
                options={objectOptions}
                onchange={handleObjectChange}>
            </lightning-combobox>
        </div>
        
        <!-- Second column - Record ID Input -->
        <div class="slds-col slds-size_1-of-2">
            <lightning-input 
                label="Record Id" 
                value={recordId} 
                onchange={handleRecordChange}
                placeholder="Enter Record ID (e.g., 001XXXXXXXXXXXXXXX)">
            </lightning-input>
        </div>
    </div>
    
    <!-- Status message below both columns -->
    <p class="slds-m-top_small slds-text-color_weak" if:true={isFormReady}>
        Viewing {objectLabel} record
    </p>
</div>

<!-- Loading spinner -->
<div if:true={isLoading} class="slds-p-around_medium slds-text-align_center">
    <lightning-spinner alternative-text="Loading"></lightning-spinner>
</div>

   
        <template if:true={isFormReady}>
           
            <section class="form-section">
                <h3 class="section-title">
                    <lightning-icon icon-name="utility:record" size="x-small"></lightning-icon>
                    Quick Record Form
                </h3>
                <lightning-record-form 
                    key={formKey}
                    object-api-name={objectApiName} 
                    record-id={recordId} 
                    layout-type="Full" 
                    mode="view"
                    onload={handleFormLoad}
                    onerror={handleFormError}>
                </lightning-record-form>
            </section>

       
            <section class="form-section">
                <h3 class="section-title">
                    <lightning-icon icon-name="utility:edit" size="x-small"></lightning-icon>
                    Custom Edit Form
                </h3>
                <lightning-record-edit-form 
                    key={formKey}
                    object-api-name={objectApiName} 
                    record-id={recordId} 
                    onsuccess={handleSuccess}
                    onload={handleFormLoad}
                    onerror={handleFormError}>
                    
                   
                    <template if:true={isAccount}>
                        <lightning-input-field field-name="Name"></lightning-input-field>
                        <lightning-input-field field-name="Phone"></lightning-input-field>
                        <lightning-input-field field-name="Website"></lightning-input-field>
                        <lightning-input-field field-name="Industry"></lightning-input-field>
                        <lightning-input-field field-name="AnnualRevenue"></lightning-input-field>
                    </template>

                    <template if:true={isContact}>
                        <lightning-input-field field-name="FirstName"></lightning-input-field>
                        <lightning-input-field field-name="LastName"></lightning-input-field>
                        <lightning-input-field field-name="Email"></lightning-input-field>
                        <lightning-input-field field-name="Phone"></lightning-input-field>
                        <lightning-input-field field-name="Title"></lightning-input-field>
                        <lightning-input-field field-name="Department"></lightning-input-field>
                    </template>

                    <template if:true={isOpportunity}>
                        <lightning-input-field field-name="Name"></lightning-input-field>
                        <lightning-input-field field-name="StageName"></lightning-input-field>
                        <lightning-input-field field-name="Amount"></lightning-input-field>
                        <lightning-input-field field-name="CloseDate"></lightning-input-field>
                        <lightning-input-field field-name="Type"></lightning-input-field>
                        <lightning-input-field field-name="LeadSource"></lightning-input-field>
                    </template>

                    <template if:true={isCase}>
                        <lightning-input-field field-name="CaseNumber"></lightning-input-field>
                        <lightning-input-field field-name="Subject"></lightning-input-field>
                        <lightning-input-field field-name="Status"></lightning-input-field>
                        <lightning-input-field field-name="Priority"></lightning-input-field>
                        <lightning-input-field field-name="Origin"></lightning-input-field>
                        <lightning-input-field field-name="Description"></lightning-input-field>
                    </template>

                    <template if:true={isLead}>
                        <lightning-input-field field-name="FirstName"></lightning-input-field>
                        <lightning-input-field field-name="LastName"></lightning-input-field>
                        <lightning-input-field field-name="Company"></lightning-input-field>
                        <lightning-input-field field-name="Email"></lightning-input-field>
                        <lightning-input-field field-name="Phone"></lightning-input-field>
                        <lightning-input-field field-name="Status"></lightning-input-field>
                    </template>

                    <template if:true={isUnsupportedObject}>
                        <div class="slds-p-around_medium slds-text-align_center">
                            <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                            <p>Custom edit form not configured for {objectLabel}. Using standard fields.</p>
                        </div>
                       
                        <lightning-input-field field-name="Name"></lightning-input-field>
                    </template>

                    <div class="slds-m-top_medium">
                        <lightning-button variant="brand" type="submit" label="Save">
                        </lightning-button>
                    </div>
                </lightning-record-edit-form>
            </section>

            <section class="form-section">
                <h3 class="section-title">
                    <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                    Record View Layout
                </h3>
                <lightning-record-view-form 
                    key={formKey}
                    record-id={recordId} 
                    object-api-name={objectApiName}
                    onload={handleFormLoad}
                    onerror={handleFormError}>
                  
                    <template if:true={isAccount}>
                        <lightning-output-field field-name="Name"></lightning-output-field>
                        <lightning-output-field field-name="Phone"></lightning-output-field>
                        <lightning-output-field field-name="Industry"></lightning-output-field>
                        <lightning-output-field field-name="AnnualRevenue"></lightning-output-field>
                    </template>

                    <template if:true={isContact}>
                        <lightning-output-field field-name="Name"></lightning-output-field>
                        <lightning-output-field field-name="Email"></lightning-output-field>
                        <lightning-output-field field-name="Phone"></lightning-output-field>
                        <lightning-output-field field-name="Title"></lightning-output-field>
                    </template>

                    <template if:true={isOpportunity}>
                        <lightning-output-field field-name="Name"></lightning-output-field>
                        <lightning-output-field field-name="StageName"></lightning-output-field>
                        <lightning-output-field field-name="Amount"></lightning-output-field>
                        <lightning-output-field field-name="CloseDate"></lightning-output-field>
                    </template>

                    <template if:true={isCase}>
                        <lightning-output-field field-name="CaseNumber"></lightning-output-field>
                        <lightning-output-field field-name="Subject"></lightning-output-field>
                        <lightning-output-field field-name="Status"></lightning-output-field>
                        <lightning-output-field field-name="Priority"></lightning-output-field>
                    </template>

                    <template if:true={isLead}>
                        <lightning-output-field field-name="Name"></lightning-output-field>
                        <lightning-output-field field-name="Company"></lightning-output-field>
                        <lightning-output-field field-name="Email"></lightning-output-field>
                        <lightning-output-field field-name="Status"></lightning-output-field>
                    </template>
                </lightning-record-view-form>
            </section>

          
            <section class="form-section" if:true={objectMetadata}>
                <h3 class="section-title">
                    <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                    Object Information
                </h3>
                <div class="slds-grid slds-wrap">
                    <div class="slds-col slds-size_1-of-2">
                        <p><strong>Object:</strong> {objectLabel}</p>
                        <p><strong>API Name:</strong> {objectApiName}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <p><strong>Record ID:</strong> {recordId}</p>
                        <p><strong>Record Type:</strong> {objectMetadata.recordTypeName}</p>
                    </div>
                </div>
            </section>
        </template>
       
        <div if:false={isFormReady} class="slds-p-around_large slds-text-align_center">
            <lightning-icon icon-name="utility:info" size="small" class="slds-m-bottom_small"></lightning-icon>
            <h3 class="slds-text-heading_small">No Record Selected</h3>
            <p class="slds-text-color_weak">Please select an object and enter a valid Record ID to view the forms.</p>
            
        
            <div class="slds-m-top_medium slds-text-color_weak slds-text-body_small">
                <p><strong>Sample Record IDs:</strong></p>
                <p>Account: 0015g00000rGmPKAA0</p>
                <p>Contact: 0035g00000fuwSDAAY</p>
                <p>Case: 5005g00000V5CdQAAV</p>
                <p>Opportunity: 0065g00000OwdPrAAJ</p>
                <p>Lead: 00Q5g00000EMnToEAL</p>
            </div>
        </div>
    </lightning-card>
</template>
