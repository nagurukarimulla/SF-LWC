<template>
    <lightning-card title="Object Metadata Explorer" icon-name="standard:object">
        <div class="slds-p-around_medium">
            <!-- Object Selection and Button -->
            <div class="slds-grid slds-gutters slds-align_center">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox
                        label="Select Object"
                        value={selectedObject}
                        options={objectOptions}
                        onchange={handleObjectChange}
                        required>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-button
                        label="Get Metadata"
                        title="Fetch object metadata"
                        onclick={handleGetMetadata}
                        variant="brand"
                        class="slds-m-top_small">
                    </lightning-button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div if:true={isLoading} class="slds-m-top_medium">
                <lightning-spinner alternative-text="Loading metadata..." size="medium">
                </lightning-spinner>
            </div>

            <!-- Error Message -->
            <div if:true={error} class="slds-m-top_medium">
                <div class="slds-text-color_error slds-p-around_medium">
                    <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    <span class="slds-m-left_x-small">Error: {error}</span>
                </div>
            </div>

            <!-- Metadata Results -->
            <template if:true={metadataResult}>
                <!-- Object Describe Information -->
                <lightning-card variant="narrow" title="Object Describe Information" class="slds-m-top_medium">
                    <div class="slds-p-around_medium">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Name:</strong> {metadataResult.objectDescribe.name}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Label:</strong> {metadataResult.objectDescribe.label}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Key Prefix:</strong> {metadataResult.objectDescribe.keyPrefix}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Updateable:</strong> {metadataResult.objectDescribe.updateable}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Createable:</strong> {metadataResult.objectDescribe.createable}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Deletable:</strong> {metadataResult.objectDescribe.deletable}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Retrieveable:</strong> {metadataResult.objectDescribe.retrieveable}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Replicateable:</strong> {metadataResult.objectDescribe.replicateable}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Undeletable:</strong> {metadataResult.objectDescribe.undeletable}
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                                <strong>Triggerable:</strong> {metadataResult.objectDescribe.triggerable}
                            </div>
                        </div>
                    </div>
                </lightning-card>

                <!-- Recent Items -->
                <lightning-card variant="narrow" title="Recent Items" class="slds-m-top_medium">
                    <template if:true={metadataResult.recentItems}>
                        <lightning-datatable
                            key-field="Id"
                            data={metadataResult.recentItems}
                            columns={recentItemsColumns}
                            hide-checkbox-column="true">
                        </lightning-datatable>
                    </template>
                    <template if:false={metadataResult.recentItems}>
                        <div class="slds-p-around_medium slds-text-align_center">
                            No recent items found
                        </div>
                    </template>
                </lightning-card>

                <!-- Full JSON Response -->
                <lightning-card variant="narrow" title="Complete JSON Response" class="slds-m-top_medium">
                    <div class="slds-p-around_medium">
                        <lightning-button 
                            label="Toggle JSON View" 
                            onclick={toggleJsonView}
                            variant="neutral">
                        </lightning-button>
                        <div if:true={showJson} class="slds-m-top_small">
                            <pre class="slds-scrollable_x slds-scrollable_y" 
                                 style="max-height: 400px; background-color: #f4f6f9; padding: 12px; border-radius: 4px; overflow: auto;">
                                <code>{formattedJson}</code>
                            </pre>
                        </div>
                    </div>
                </lightning-card>
            </template>
        </div>
    </lightning-card>
</template>
