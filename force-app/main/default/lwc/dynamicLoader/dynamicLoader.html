<template>
    <lightning-card title="Enterprise Utility Hub" icon-name="standard:bot">
        <!-- Header with action buttons -->
        <div class="slds-p-around_medium" slot="actions">
            <lightning-button-icon 
                icon-name="utility:refresh" 
                alternative-text="Refresh"
                title="Refresh Status"
                onclick={checkAllConsent}>
            </lightning-button-icon>
        </div>

        <!-- Main Utility Buttons -->
        <div class="slds-p-around_medium">
            <lightning-layout multiple-rows="true">
                <template for:each={utilities} for:item="util">
                    <lightning-layout-item key={util.name} size="6" medium-size="4" large-size="3">
                        <lightning-button 
                            label={util.label} 
                            data-name={util.name} 
                            onclick={handleAction}
                            class="slds-m-right_small slds-m-bottom_small"
                            variant="brand"
                            disabled={isProcessing}>
                        </lightning-button>
                    </lightning-layout-item>
                </template>
            </lightning-layout>
        </div>

        <!-- Image Upload Section -->
        <div if:true={showImageUpload} class="slds-p-around_medium slds-border_top">
            <lightning-card title="Image Compression Demo" variant="narrow">
                <div class="slds-p-around_medium">
                    <lightning-input 
                        type="file" 
                        label="Select image to compress"
                        accept="image/*"
                        onchange={handleFileUpload}
                        disabled={isProcessing}>
                    </lightning-input>
                    
                    <div if:true={isProcessing} class="slds-m-top_medium">
                        <lightning-spinner alternative-text="Processing"></lightning-spinner>
                    </div>
                    
                    <!-- Fixed: Using computed properties instead of function calls -->
                    <div if:true={originalFileSize} class="slds-m-top_medium">
                        <p><strong>Original Size:</strong> {originalFileSizeFormatted}</p>
                        <p><strong>Compressed Size:</strong> {compressedFileSizeFormatted}</p>
                        <p if:true={compressionRatio}><strong>Reduction:</strong> {compressionRatio}%</p>
                    </div>
                    
                    <div if:true={compressedImageUrl} class="slds-m-top_medium">
                        <p class="slds-text-heading_small">Preview:</p>
                        <img src={compressedImageUrl} alt="Compressed" 
                             style="max-width: 100%; max-height: 300px; border: 1px solid #ddd; border-radius: 4px; padding: 5px;"/>
                    </div>
                </div>
            </lightning-card>
        </div>

        <!-- Cookie Consent Section -->
        <div if:false={showImageUpload} class="slds-p-around_medium slds-border_top">
            <lightning-card title="Cookie Consent Management" variant="narrow">
                <div class="slds-p-around_medium">
                    <div class="slds-m-bottom_medium">
                        <p>We use cookies to personalize content and ads. Select your preferences below:</p>
                    </div>
                    
                    <!-- Essential (always enabled) -->
                    <div class="slds-m-bottom_medium">
                        <h3><b>🍪 Essential Cookies</b></h3>
                        <lightning-input
                            type="toggle"
                            label="Required for basic functionality"
                            checked="true"
                            disabled>
                        </lightning-input>
                    </div>
                    
                    <!-- Preferences -->
                    <div class="slds-m-bottom_medium">
                        <h3><b>🎨 Preferences</b></h3>
                        <lightning-input
                            type="toggle"
                            label="Remember your settings and preferences"
                            data-category="Preferences"
                            checked={cookiePreferences.Preferences}
                            onchange={handlePreferenceChange}>
                        </lightning-input>
                        <p class="slds-text-body_small slds-m-top_xx-small">
                            Current Status: 
                            <lightning-badge 
                                label={consentStatus.PreferencesText} 
                                variant={consentStatus.PreferencesVariant}>
                            </lightning-badge>
                        </p>
                    </div>
                    
                    <!-- Marketing -->
                    <div class="slds-m-bottom_medium">
                        <h3><b>📢 Marketing</b></h3>
                        <lightning-input
                            type="toggle"
                            label="Allow marketing and advertising cookies"
                            data-category="Marketing"
                            checked={cookiePreferences.Marketing}
                            onchange={handlePreferenceChange}>
                        </lightning-input>
                        <p class="slds-text-body_small slds-m-top_xx-small">
                            Current Status: 
                            <lightning-badge 
                                label={consentStatus.MarketingText} 
                                variant={consentStatus.MarketingVariant}>
                            </lightning-badge>
                        </p>
                    </div>
                    
                    <!-- Statistics -->
                    <div class="slds-m-bottom_medium">
                        <h3><b>📊 Statistics</b></h3>
                        <lightning-input
                            type="toggle"
                            label="Help us improve with anonymous usage data"
                            data-category="Statistics"
                            checked={cookiePreferences.Statistics}
                            onchange={handlePreferenceChange}>
                        </lightning-input>
                        <p class="slds-text-body_small slds-m-top_xx-small">
                            Current Status: 
                            <lightning-badge 
                                label={consentStatus.StatisticsText} 
                                variant={consentStatus.StatisticsVariant}>
                            </lightning-badge>
                        </p>
                    </div>
                    
                    <div class="slds-m-top_medium">
                        <lightning-button
                            label="Save Preferences"
                            variant="brand"
                            onclick={saveCookiePreferences}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button
                            label="Check Status"
                            variant="neutral"
                            onclick={checkAllConsent}>
                        </lightning-button>
                    </div>
                </div>
            </lightning-card>
        </div>

        <!-- Demo Data Display -->
        <div class="slds-p-around_medium slds-border_top slds-theme_shade">
            <lightning-layout>
                <lightning-layout-item flexibility="auto">
                    <p><strong>📊 Demo Data:</strong> {demoData.value}</p>
                    <p class="slds-text-body_small">Last Updated: {demoData.timestamp}</p>
                </lightning-layout-item>
            </lightning-layout>
        </div>

        <!-- Status Message -->
        <div class="slds-p-around_medium slds-border_top" slot="footer">
            <p class="slds-text-heading_small">Status:</p>
            <p class="slds-text-body_regular slds-m-top_small">{resultMessage}</p>
        </div>
    </lightning-card>
</template>
