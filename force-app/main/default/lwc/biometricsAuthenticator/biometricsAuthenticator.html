<template>
    <lightning-card title="Biometric Authentication Center"
                    icon-name="utility:approval">
        <div class="slds-p-around_medium">
            <!-- Action Buttons -->
            <div class="button-container">
                <lightning-button label="Check Availability"
                                  variant="brand"
                                  onclick={checkAvailability}
                                  class="action-btn">
                </lightning-button>
                <lightning-button label="Check Ready Status"
                                  variant="brand-outline"
                                  onclick={checkReady}
                                  class="action-btn">
                </lightning-button>
                <lightning-button label="Authenticate User"
                                  variant="success"
                                  onclick={authenticateUser}
                                  class="action-btn">
                </lightning-button>
            </div>
            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner size="medium">
                    </lightning-spinner>
                </div>
            </template>
            <div class="slds-box slds-theme_default slds-m-top_medium">
                <p class="slds-text-heading_small">
                    Current Status
                </p>
                <div class="slds-m-top_small">
                    <lightning-formatted-text value={status}>
                    </lightning-formatted-text>
                </div>
            </div>
            <template if:true={logs.length}>
                <div class="slds-m-top_medium">
                    <p class="slds-text-heading_small">
                        Activity Log
                    </p>
                    <template for:each={logs}
                              for:item="log">
                        <div key={log.id}
                             class="log-row">
                            {log.message}
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
