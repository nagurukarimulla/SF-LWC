<template>
    <lightning-card title="Apex Pagination Cursor - 5 Records Per Page">
        
        <!-- Record Info -->
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <span class="slds-badge slds-m-right_small">
                Page {currentPage} of {totalPages}
            </span>
            <span class="slds-badge">
                Showing {accounts.length} of {totalRecords} records
            </span>
            <span if:true={deletedRows} class="slds-badge slds-theme_warning slds-m-left_small">
                Skipped {deletedRows} deleted
            </span>
        </div>
        
        <!-- Data Table -->
        <div class="slds-p-horizontal_medium">
            <lightning-datatable
                key-field="Id"
                data={accounts}
                columns={columns}
                hide-checkbox-column="true">
            </lightning-datatable>
        </div>
        
        <!-- Pagination Buttons -->
        <div class="slds-grid slds-grid_align-center slds-p-around_medium">
            <lightning-button
                label="Previous"
                icon-name="utility:chevronleft"
                onclick={handlePrevious}
                disabled={disablePrevious}
                class="slds-m-right_small">
            </lightning-button>
            
            <lightning-button
                label="Next"
                icon-name="utility:chevronright"
                icon-position="right"
                onclick={handleNext}
                disabled={disableNext}>
            </lightning-button>
        </div>
        
        <!-- Loading Spinner -->
        <div if:true={isLoading} class="slds-align_absolute-center">
            <lightning-spinner></lightning-spinner>
        </div>
        
    </lightning-card>
</template>
