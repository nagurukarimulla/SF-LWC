<template>
    <div class="slds-p-around_medium">
        <!-- Header -->
        <div class="slds-page-header slds-m-bottom_medium">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <h1 class="slds-page-header__title">Change Data Capture - Case Monitor</h1>
                    <p class="slds-text-body_small slds-m-top_xx-small">
                        Real-time updates from any source (API, another user, workflow, etc.)
                    </p>
                </div>
            </div>
        </div>
        
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-is-relative slds-m-top_large">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>
        
        <!-- Data Table -->
        <template if:false={isLoading}>
            <div class="slds-card">
                <div class="slds-card__header slds-grid">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">Case Records (Latest 3)</h2>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Double-click any cell to edit, then click "Save" to commit changes
                            </p>
                        </div>
                    </header>
                </div>
                
                <div class="slds-card__body">
                    <lightning-datatable
                        key-field="Id"
                        data={cases}
                        columns={columns}
                        onsave={handleSave}
                        oncellchange={handleCellChange}
                        draft-values={draftValues}
                        hide-checkbox-column="true">
                    </lightning-datatable>
                </div>
            </div>
        </template>
        
        <!-- CDC Monitor Panel -->
        <div class="slds-card slds-m-top_medium">
            <div class="slds-card__header">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">📡 Change Data Capture Monitor</h2>
                        <p class="slds-text-body_small">Detects changes from ANY source in real-time</p>
                    </div>
                </header>
            </div>
            
            <div class="slds-card__body slds-p-around_small">
                <template if:true={showChangedFields}>
                    <div class="slds-theme_shade slds-p-around_small slds-border_top slds-border_bottom">
                        <div class="slds-grid slds-grid_align-spread">
                            <div>
                                <lightning-icon icon-name="standard:change_record" size="small"></lightning-icon>
                                <span class="slds-m-left_small slds-text-heading_small">Latest Changes Detected!</span>
                            </div>
                        </div>
                        <div class="slds-m-top_small">
                            <strong>Fields changed:</strong> {changedFields}
                        </div>
                        <div class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                            Changes stay visible until new updates arrive
                        </div>
                    </div>
                </template>
                <template if:false={showChangedFields}>
                    <div class="slds-text-body_small slds-text-color_weak slds-p-around_small">
                        <lightning-icon icon-name="utility:event_monitoring" size="x-small"></lightning-icon>
                        <span class="slds-m-left_small">
                            Waiting for Case change events... 
                            <button class="slds-button slds-button_text" onclick={testCDCRefresh}>
                                Test Refresh
                            </button>
                        </span>
                        <div class="slds-text-body_small slds-m-top_x-small">
                            <strong>Setup:</strong> Ensure Change Data Capture is enabled for Case object in Setup → Change Data Capture
                        </div>
                    </div>
                </template>
                
                <!-- Test Instructions -->
                <div class="slds-m-top_small slds-border_top slds-p-top_small">
                    <p class="slds-text-body_small slds-text-color_weak">
                        <strong>💡 Test CDC:</strong> Open another tab, edit any case record, and watch this component update automatically!
                    </p>
                </div>
            </div>
        </div>
    </div>
</template>
