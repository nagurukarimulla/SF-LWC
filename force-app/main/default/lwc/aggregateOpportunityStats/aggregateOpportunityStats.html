<template>
    <lightning-card title="Opportunity Aggregate Stats" icon-name="standard:opportunity">

        <template if:true={results}>
            <template for:each={results} for:item="opp">

                <div key={opp.aggregate} class="slds-grid slds-wrap slds-p-around_medium">
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <div class="slds-text-title_caps slds-m-bottom_xx-small">Average</div>
                        <lightning-badge
                            label={opp.aggregate.Amount.avg.displayValue}
                            icon-name="utility:moneybag">
                        </lightning-badge>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_medium">
                        <div class="slds-text-title_caps slds-m-bottom_xx-small">Sum</div>
                        <lightning-badge
                            label={opp.aggregate.Amount.sum.displayValue}
                            icon-name="utility:money">
                        </lightning-badge>
                    </div>
                </div>

            </template>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <p>
                    <strong>Total Opportunities:</strong>
                    {totalCount}
                </p>
            </div>

        </template>

        <template if:true={errors}>
            <p class="slds-text-color_error slds-p-around_medium">
                Error loading data
            </p>
        </template>

    </lightning-card>
</template>
