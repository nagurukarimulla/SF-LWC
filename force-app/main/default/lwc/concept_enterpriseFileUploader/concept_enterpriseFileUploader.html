<template>
    <lightning-card title={cardTitle} icon-name="standard:file">
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_xx-large">
                <lightning-spinner alternative-text="Loading..."></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <!-- Dynamic Context Display (shows where files will go) -->
                <div class="slds-m-bottom_medium slds-text-color_weak slds-text-body_small">
                    <template if:true={hasRecordContext}>
                        <lightning-icon icon-name="utility:record" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Uploading to: <strong>{contextLabel}</strong> ({contextType})
                    </template>
                    <template if:false={hasRecordContext}>
                        <lightning-icon icon-name="utility:user" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Uploading to: <strong>My Personal Files</strong>
                    </template>
                </div>

                <!-- File Description -->
                <lightning-input
                    label="File Description"
                    value={fileDescription}
                    onchange={handleDescriptionChange}
                    placeholder="Enter file description (optional)"
                    class="slds-m-bottom_medium">
                </lightning-input>

                <!-- File Tags -->
                <lightning-input
                    label="Tags"
                    value={fileTags}
                    onchange={handleTagsChange}
                    placeholder="Enter tags separated by commas"
                    class="slds-m-bottom_medium">
                </lightning-input>

                <!-- File Upload Component -->
                <lightning-file-upload
                    label={uploadLabel}
                    name="enterprise-file-uploader"
                    accept={acceptedFormats}
                    record-id={effectiveRecordId}
                    onuploadfinished={handleUploadFinished}
                    onuploadprogress={handleUploadProgress}
                    disabled={isUploadDisabled}
                    multiple={allowMultiple}
                    class="slds-m-bottom_medium">
                </lightning-file-upload>

                <!-- Upload Progress Summary -->
                <template if:true={showProgressSummary}>
                    <div class="slds-box slds-box_x-small slds-theme_info slds-m-bottom_medium">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <strong>Uploading: {uploadedCount} of {totalFiles} files</strong>
                                <div class="slds-progress-bar slds-progress-bar_circular" aria-valuemin="0" aria-valuemax="100" aria-valuenow={uploadProgress} role="progressbar">
                                    <span class="slds-progress-bar__value" style={progressStyle}></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Uploaded Files List -->
                <template if:true={uploadedFiles.length}>
                    <div class="slds-box slds-m-bottom_medium">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            Recently Uploaded Files
                            <span class="slds-badge slds-m-left_x-small">{uploadedFiles.length}</span>
                        </h3>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>File Name</th>
                                    <th>Size</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={uploadedFiles} for:item="file">
                                    <tr key={file.documentId}>
                                        <td>
                                            <lightning-icon icon-name={file.iconName} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            <a href={file.fileUrl} target="_blank">{file.name}</a>
                                        </td>
                                        <td>{file.formattedSize}</td>
                                        <td>{file.fileType}</td>
                                        <td>
                                            <span class="slds-badge slds-theme_success">Uploaded</span>
                                        </td>
                                        <td>
                                            <lightning-button-icon
                                                icon-name="utility:delete"
                                                alternative-text="Delete"
                                                onclick={handleDeleteFile}
                                                data-file-id={file.documentId}
                                                title="Delete">
                                            </lightning-button-icon>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <!-- File History - Shows based on current context -->
                <template if:true={showHistory}>
                    <div class="slds-box">
                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            <template if:true={hasRecordContext}>
                                Files for this {contextType}
                            </template>
                            <template if:false={hasRecordContext}>
                                My Personal Files
                            </template>
                            <lightning-button-icon
                                icon-name="utility:refresh"
                                alternative-text="Refresh"
                                onclick={refreshHistory}
                                class="slds-m-left_x-small">
                            </lightning-button-icon>
                        </h3>
                        <template if:true={fileHistory.length}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>File Name</th>
                                        <th>Uploaded By</th>
                                        <th>Size</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={fileHistory} for:item="history">
                                        <tr key={history.contentDocumentId}>
                                            <td>{history.uploadedDate}</td>
                                            <td>
                                                <a href={history.fileUrl} target="_blank">{history.title}</a>
                                            </td>
                                            <td>{history.uploadedBy}</td>
                                            <td>{history.formattedSize}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={fileHistory.length}>
                            <p class="slds-text-color_weak slds-align_absolute-center slds-p-vertical_medium">
                                No files found
                            </p>
                        </template>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
