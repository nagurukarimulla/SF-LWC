<template>
    <!-- Modal Header -->
    <lightning-modal-header label="My Modal Window">
    </lightning-modal-header>

    <!-- Modal Body -->
    <lightning-modal-body>
        <div class="slds-p-around_medium">
            <p class="slds-text-heading_medium">
                Select Any Option
            </p>

            <br/>

            <template for:each={options} for:item="option">
                <lightning-button
                    key={option.id}
                    label={option.label}
                    data-id={option.id}
                    onclick={handleOptionClick}
                    class="slds-m-right_small slds-m-bottom_small">
                </lightning-button>
            </template>
        </div>
    </lightning-modal-body>

    <!-- Modal Footer -->
    <lightning-modal-footer>
        <lightning-button
            label="Close"
            onclick={handleClose}>
        </lightning-button>
    </lightning-modal-footer>
</template>
