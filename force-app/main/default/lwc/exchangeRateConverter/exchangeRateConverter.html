<template>
    <lightning-card title="Exchange Rate Converter" icon-name="utility:currency">
        <div class="slds-p-around_medium">
            <!-- Base Currency Selection -->
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        name="baseCurrency"
                        label="Base Currency"
                        value={baseCurrency}
                        placeholder="Search or Select Base Currency"
                        options={currencyOptions}
                        onchange={handleBaseCurrencyChange}
                    ></lightning-combobox>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Get Exchange Rates"
                    onclick={handleGetRates}
                    disabled={isLoading}
                    class="slds-m-right_x-small"
                    icon-name="utility:refresh"
                ></lightning-button>
                
                <lightning-button
                    variant="neutral"
                    label="Clear"
                    onclick={handleClear}
                    disabled={isLoading}
                    icon-name="utility:clear"
                ></lightning-button>
            </div>
            
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-m-top_medium slds-align_absolute-center" style="height: 4rem;">
                    <lightning-spinner
                        alternative-text="Loading exchange rates..."
                        size="medium"
                        variant="brand"
                    ></lightning-spinner>
                </div>
            </template>
            
            <!-- Error Message -->
            <template if:true={errorMessage}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                        <span class="slds-text-body_small">{errorMessage}</span>
                    </div>
                </div>
            </template>
            
            <!-- Exchange Rate Info -->
            <template if:true={baseCode}>
                <div class="slds-m-top_medium">
                    <div class="slds-box slds-theme_shade">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <span class="slds-text-title slds-text-color_weak">Base Currency</span>
                                <p class="slds-text-heading_medium">{baseCode}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <span class="slds-text-title slds-text-color_weak">Last Updated</span>
                                <p class="slds-text-body_medium">{timeLastUpdateUtc}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                <span class="slds-text-title slds-text-color_weak">Next Update</span>
                                <p class="slds-text-body_medium">{timeNextUpdateUtc}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            
            <!-- Conversion Rates Table -->
            <template if:true={filteredRates.length}>
                <div class="slds-m-top_medium">
                    <!-- Search/Filter Input -->
                    <div class="slds-grid slds-gutters slds-align-center">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                type="search"
                                label="Search Currency"
                                placeholder="Search by code or name..."
                                value={searchTerm}
                                onchange={handleSearch}
                                icon-name="utility:search"
                            ></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <span class="slds-text-body_small slds-text-color_weak">
                                Showing {filteredRates.length} of {conversionRates.length} currencies
                            </span>
                        </div>
                    </div>
                    
                    <!-- Table -->
                    <div class="slds-table_header-fixed_container slds-scrollable_y slds-m-top_small" style="max-height: 500px;">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th class="" scope="col">
                                        <div class="slds-truncate slds-text-title_caps">Currency Code</div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate slds-text-title_caps">Currency Name</div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate slds-text-title_caps">Exchange Rate</div>
                                    </th>
                                    <th class="" scope="col">
                                        <div class="slds-truncate slds-text-title_caps">1 {baseCode} =</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={filteredRates} for:item="rate">
                                    <tr key={rate.code} class="slds-hint-parent">
                                        <td data-label="Currency Code">
                                            <div class="slds-truncate">
                                                <span class="slds-badge slds-theme_inverse">{rate.code}</span>
                                            </div>
                                        </td>
                                        <td data-label="Currency Name">
                                            <div class="slds-truncate" title={rate.label}>
                                                {rate.label}
                                            </div>
                                        </td>
                                        <td data-label="Exchange Rate">
                                            <div class="slds-truncate">
                                                <span class="slds-text-title_bold">
                                                    {rate.rate}
                                                </span>
                                            </div>
                                        </td>
                                        <td data-label="Conversion">
                                            <div class="slds-truncate">
                                                <span class="slds-text-body_small">
                                                    1 {baseCode} = {rate.rate} {rate.code}
                                                </span>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
            
            <!-- No Results -->
            <template if:false={isLoading}>
                <template if:true={baseCode}>
                    <template if:false={filteredRates.length}>
                        <div class="slds-m-top_medium slds-align_absolute-center">
                            <div class="slds-text-align_center slds-text-color_weak">
                                <lightning-icon icon-name="utility:search" size="large"></lightning-icon>
                                <p class="slds-m-top_small">No currencies found matching your search.</p>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
