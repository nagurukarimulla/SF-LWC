<template>
    <lightning-card title="Dynamic Layout Selector">
        <div class="slds-m-around_medium">
            <!-- Object Dropdown -->
            <lightning-combobox
                label="Select Object"
                value={selectedObject}
                options={objectOptions}
                onchange={handleObjectChange}>
            </lightning-combobox>

            <!-- Layout Dropdown -->
            <lightning-combobox
                label="Select Layout Type"
                value={selectedLayout}
                options={layoutOptions}
                onchange={handleLayoutChange}>
            </lightning-combobox>

            <!-- Mode Dropdown -->
            <lightning-combobox
                label="Select Mode"
                value={selectedMode}
                options={modeOptions}
                onchange={handleModeChange}>
            </lightning-combobox>
        </div>

        <!-- Loading indicator -->
        <template if:true={isLoading}>
            <div class="slds-m-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <!-- Layout Output -->
        <template if:true={layoutData}>
            <div class="slds-m-around_medium">
                <!-- Success message with counts -->
                <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">Success</span>
                    <span class="slds-icon_container slds-icon-utility-success slds-m-right_x-small" title="Success">
                        <lightning-icon icon-name="utility:success" size="x-small"></lightning-icon>
                    </span>
                    <h2>Layout fetched successfully for {selectedObject} ({selectedLayout}, {selectedMode})</h2>
                </div>
                
                <!-- Layout Summary -->
                <div class="slds-box slds-m-bottom_medium">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <strong>Sections:</strong> {sectionCount}
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <strong>Fields:</strong> {fieldCount}
                        </div>
                        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <strong>ID:</strong> {layoutData.id}
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <strong>Object:</strong> {layoutData.objectApiName}
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <strong>Layout Type:</strong> {layoutData.layoutType}
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <strong>Mode:</strong> {layoutData.mode}
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
                            <strong>Record Type ID:</strong> {layoutData.recordTypeId}
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-p-around_x-small">
                            <strong>Layout Name:</strong> {layoutDisplayName}
                        </div>
                    </div>
                </div>

                <!-- Detailed Layout Sections -->
                <div>
                    <template for:each={processedSections} for:item="section">
                        <div key={section.id} class="slds-box slds-m-bottom_small">
                            <button type="button" class="slds-button slds-button_neutral slds-m-bottom_small" 
                                    onclick={handleSectionToggle}
                                    data-section-id={section.id}
                                    aria-expanded={section.ariaExpanded} 
                                    aria-controls={section.contentId}>
                                <lightning-icon icon-name={section.toggleIconName} 
                                                size="x-small" 
                                                class="slds-m-right_x-small">
                                </lightning-icon>
                                <span class="slds-truncate" title={section.name}>
                                    <lightning-icon icon-name="utility:table" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    {section.name} ({section.fieldCount} fields)
                                </span>
                            </button>
                            <template if:true={section.expanded}>
                                <div id={section.contentId} class="slds-p-around_medium">
                                    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th>Field Label</th>
                                                <th>Field API Name</th>
                                                <th>Required</th>
                                                <th>Read Only</th>
                                                <th>Type</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={section.fields} for:item="field">
                                                <tr key={field.id}>
                                                    <td>{field.label}</td>
                                                    <td>
                                                        <span class="slds-badge slds-m-right_xx-small">{field.field}</span>
                                                    </td>
                                                    <td>
                                                        <lightning-icon icon-name={field.requiredIcon} size="x-small" class={field.requiredClass}></lightning-icon>
                                                        <span class="slds-assistive-text">{field.required}</span>
                                                    </td>
                                                    <td>
                                                        <lightning-icon icon-name={field.readOnlyIcon} size="x-small" class={field.readOnlyClass}></lightning-icon>
                                                        <span class="slds-assistive-text">{field.readOnly}</span>
                                                    </td>
                                                    <td>
                                                        <span class="slds-badge">{field.displayType}</span>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- No Sections Message -->
        <template if:true={noSections}>
            <div class="slds-m-around_medium slds-align_absolute-center slds-text-color_weak">
                No layout sections found for this configuration.
            </div>
        </template>

        <!-- Error Display -->
        <template if:true={error}>
            <div class="slds-m-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Error">
                        <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                    </span>
                    <h2>Error: {errorMessage}</h2>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
