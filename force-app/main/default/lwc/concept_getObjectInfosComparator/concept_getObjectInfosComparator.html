<template>
    <lightning-card title="Object Comparator" icon-name="standard:object">
        <div class="slds-p-around_medium">
            
            <!-- Object Selection -->
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        label="First Object"
                        value={firstObject}
                        options={objectOptions}
                        onchange={handleFirstChange}
                        required>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        label="Second Object"
                        value={secondObject}
                        options={objectOptions}
                        onchange={handleSecondChange}
                        required>
                    </lightning-combobox>
                </div>
            </div>

            <!-- Same Object Warning -->
            <template if:true={isSameObjectSelected}>
                <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-top_medium" role="alert">
                    <span class="slds-assistive-text">Warning</span>
                    <p>You cannot compare the same object. Please select different objects.</p>
                </div>
            </template>

            <!-- Loading State -->
            <template if:true={showLoading}>
                <lightning-spinner alternative-text="Loading objects..."></lightning-spinner>
            </template>

            <!-- Error State -->
            <template if:true={showError}>
                <div class="slds-theme_error slds-p-around_small slds-m-top_medium">
                    <p>{errorMessage}</p>
                </div>
            </template>

            <!-- Comparison Results -->
            <template if:true={hasData}>
                <div class="slds-m-top_medium">
                    <!-- Object Names -->
                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <h3 class="slds-text-heading_medium">{firstObjectData.label}</h3>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <h3 class="slds-text-heading_medium">{secondObjectData.label}</h3>
                        </div>
                    </div>

                    <!-- Basic Info Comparison -->
                    <div class="slds-box slds-m-bottom_medium">
                        <h4 class="slds-text-heading_small slds-m-bottom_small">Basic Information</h4>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Property</th>
                                    <th>{firstObjectData.label}</th>
                                    <th>{secondObjectData.label}</th>
                                    <th>Match</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>API Name</td>
                                    <td>{firstObjectData.apiName}</td>
                                    <td>{secondObjectData.apiName}</td>
                                    <td>
                                        <template if:true={compareApiName}>
                                            <lightning-icon icon-name="action:approval" size="x-small" class="slds-text-color_success"></lightning-icon>
                                        </template>
                                        <template if:false={compareApiName}>
                                            <lightning-icon icon-name="action:close" size="x-small" class="slds-text-color_error"></lightning-icon>
                                        </template>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Key Prefix</td>
                                    <td>{firstObjectData.keyPrefix}</td>
                                    <td>{secondObjectData.keyPrefix}</td>
                                    <td>
                                        <template if:true={compareKeyPrefix}>
                                            <lightning-icon icon-name="action:approval" size="x-small" class="slds-text-color_success"></lightning-icon>
                                        </template>
                                        <template if:false={compareKeyPrefix}>
                                            <lightning-icon icon-name="action:close" size="x-small" class="slds-text-color_error"></lightning-icon>
                                        </template>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Capabilities Comparison -->
                    <div class="slds-box slds-m-bottom_medium">
                        <h4 class="slds-text-heading_small slds-m-bottom_small">Capabilities</h4>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr>
                                    <th>Capability</th>
                                    <th>{firstObjectData.label}</th>
                                    <th>{secondObjectData.label}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Createable</td>
                                    <td><lightning-badge label={firstCreateable} variant={firstCreateableVariant}></lightning-badge></td>
                                    <td><lightning-badge label={secondCreateable} variant={secondCreateableVariant}></lightning-badge></td>
                                </tr>
                                <tr>
                                    <td>Updateable</td>
                                    <td><lightning-badge label={firstUpdateable} variant={firstUpdateableVariant}></lightning-badge></td>
                                    <td><lightning-badge label={secondUpdateable} variant={secondUpdateableVariant}></lightning-badge></td>
                                </tr>
                                <tr>
                                    <td>Deletable</td>
                                    <td><lightning-badge label={firstDeletable} variant={firstDeletableVariant}></lightning-badge></td>
                                    <td><lightning-badge label={secondDeletable} variant={secondDeletableVariant}></lightning-badge></td>
                                </tr>
                                <tr>
                                    <td>Queryable</td>
                                    <td><lightning-badge label={firstQueryable} variant={firstQueryableVariant}></lightning-badge></td>
                                    <td><lightning-badge label={secondQueryable} variant={secondQueryableVariant}></lightning-badge></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Field Count Comparison -->
                    <div class="slds-box">
                        <h4 class="slds-text-heading_small slds-m-bottom_small">Field Statistics</h4>
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-progress-bar
                                    value={firstFieldPercentage}
                                    size="large"
                                    variant={firstFieldVariant}>
                                </lightning-progress-bar>
                                <p class="slds-m-top_small">Total Fields: {firstFieldCount}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-progress-bar
                                    value={secondFieldPercentage}
                                    size="large"
                                    variant={secondFieldVariant}>
                                </lightning-progress-bar>
                                <p class="slds-m-top_small">Total Fields: {secondFieldCount}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
