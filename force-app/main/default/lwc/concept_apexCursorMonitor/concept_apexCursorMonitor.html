<template>
    <lightning-card title="Apex Cursor Monitor" icon-name="standard:cms_dispatch">
        <div slot="actions">
            <lightning-button-icon 
                icon-name="utility:refresh" 
                variant="border-filled" 
                onclick={handleReset} 
                tooltip="Reset Monitor"
                disabled={isJobRunning}>
            </lightning-button-icon>
        </div>

        <div class="slds-p-around_medium">
            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-button 
                        label="Execute Migration Job" 
                        onclick={startJob} 
                        variant="brand" 
                        icon-name="utility:play"
                        disabled={isJobRunning}>
                    </lightning-button>
                </div>
                <div class="slds-col slds-text-align_right">
                    <span class={statusBadgeClass}>{status}</span>
                </div>
            </div>

            <hr class="slds-m-vertical_medium" />

            <div class="slds-grid slds-wrap slds-text-align_center slds-m-bottom_large">
                <div class="slds-col slds-size_1-of-3 slds-border_right">
                    <div class="slds-text-title slds-m-bottom_xx-small">Total</div>
                    <div class="slds-text-heading_medium">{totalRecords}</div>
                </div>
                <div class="slds-col slds-size_1-of-3 slds-border_right">
                    <div class="slds-text-title slds-m-bottom_xx-small">Processed</div>
                    <div class="slds-text-heading_medium slds-text-color_success">{processed}</div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-text-title slds-m-bottom_xx-small">Failed</div>
                    <div class="slds-text-heading_medium slds-text-color_error">{failed}</div>
                </div>
            </div>

            <template if:true={showProgress}>
                <div class="slds-m-vertical_large">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                        <span>Progress</span>
                        <span class="slds-text-title_bold">{progressPercentage}%</span>
                    </div>
                    <lightning-progress-bar 
                        value={progressPercentage} 
                        size="large" 
                        variant="thick">
                    </lightning-progress-bar>
                </div>
            </template>

            <template if:true={isCompleted}>
                <div class="slds-notify slds-notify_alert slds-theme_success slds-m-top_medium" role="alert">
                    <lightning-icon icon-name="utility:success" variant="inverse" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <h2>Migration Completed Successfully</h2>
                </div>
            </template>

            <template if:true={isFailed}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-top_medium" role="alert">
                    <lightning-icon icon-name="utility:error" variant="inverse" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <h2>Job Failed: {error}</h2>
                </div>
            </template>

            <template if:true={jobId}>
                <p class="slds-text-body_small slds-m-top_medium slds-text-align_center slds-text-color_weak">
                    Job Reference: {jobId}
                </p>
            </template>
        </div>
    </lightning-card>
</template>
