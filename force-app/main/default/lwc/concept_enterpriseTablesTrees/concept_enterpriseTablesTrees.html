<template>
    <lightning-card title="Enterprise Data Explorer">

        <!-- Header Actions -->
        <div slot="actions">
            <lightning-button-group>
                <lightning-button-icon icon-name="utility:refresh" onclick={handleRefresh} alternative-text="Refresh"
                    title="Refresh">
                </lightning-button-icon>
                <lightning-button-icon icon-name="utility:export" onclick={handleExport} alternative-text="Export"
                    title="Export">
                </lightning-button-icon>
            </lightning-button-group>
        </div>

        <!-- Main Layout -->
        <div class="slds-grid slds-wrap">

            <!-- Navigation Sidebar -->
            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-large-size_2-of-12 nav-sidebar">
                <!-- Tree Navigation -->
                <lightning-tree items={navigationItems} onselect={handleNavigationSelect}>
                </lightning-tree>

                <!-- Quick Stats -->
                <div class="slds-m-top_medium slds-border_top slds-pt_medium">
                    <div class="slds-text-title_bold slds-p-bottom_x-small">QUICK STATS</div>
                    <div class="slds-grid slds-p-vertical_xx-small">
                        <span class="slds-col slds-size_6-of-12">Records:</span>
                        <span class="slds-col slds-size_6-of-12 slds-text-align_right">{totalRecords}</span>
                    </div>
                    <div class="slds-grid slds-p-vertical_xx-small">
                        <span class="slds-col slds-size_6-of-12">Selected:</span>
                        <span class="slds-col slds-size_6-of-12 slds-text-align_right">{selectedCount}</span>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="slds-col slds-size_12-of-12 slds-medium-size_9-of-12 slds-large-size_10-of-12 content-area">

                <!-- Search Bar (Only for Accounts Table) -->
                <template if:true={isAccountsView}>
                    <div class="slds-grid slds-m-bottom_medium">
                        <div class="slds-col slds-size_6-of-12">
                            <lightning-input type="search" placeholder="Search records..." value={searchTerm}
                                onchange={handleSearch} variant="label-hidden" label="Search">
                            </lightning-input>
                        </div>
                    </div>
                </template>

                <!-- Loading Spinner -->
                <template if:true={isLoading}>
                    <div class="slds-align_absolute-center slds-m-vertical_xx-large">
                        <lightning-spinner alternative-text="Loading"></lightning-spinner>
                    </div>
                </template>

                <!-- Content -->
                <template if:false={isLoading}>

                    <!-- ACCOUNTS TABLE VIEW -->
                    <template if:true={isAccountsView}>
                        <template if:true={paginatedTableData.length}>
                            <lightning-datatable key-field="Id" data={paginatedTableData} columns={tableColumns}
                                onrowselection={handleRowSelection} hide-checkbox-column="false">
                            </lightning-datatable>
                        </template>

                        <template if:false={paginatedTableData.length}>
                            <div class="slds-illustration slds-illustration_small">
                                <p class="slds-text-heading_small">No accounts found</p>
                            </div>
                        </template>
                    </template>

                    <!-- HIERARCHY TREE VIEW -->
                    <template if:true={isHierarchyView}>
                        <template if:true={paginatedHierarchyData.length}>
                            <lightning-tree-grid columns={hierarchyColumns} data={paginatedHierarchyData} key-field="id"
                                class="hierarchy-grid">
                            </lightning-tree-grid>
                        </template>

                        <template if:false={paginatedHierarchyData.length}>
                            <div class="slds-illustration slds-illustration_small">
                                <p class="slds-text-heading_small">No hierarchy data found</p>
                            </div>
                        </template>
                    </template>

                    <!-- PAGINATION CONTROLS -->
                    <template if:true={totalRecords}>
                        <div class="slds-grid slds-grid_align_center slds-m-top_medium slds-m-bottom_medium">
                            <lightning-button icon-name="utility:chevronleft" label="Previous"
                                disabled={isPreviousDisabled} onclick={handlePreviousPage} class="slds-m-right_x-small">
                            </lightning-button>
                            <span class="slds-p-horizontal_small slds-align-middle">{pageInfo}</span>
                            <lightning-button icon-name="utility:chevronright" label="Next" icon-position="right"
                                disabled={isNextDisabled} onclick={handleNextPage}>
                            </lightning-button>
                        </div>
                    </template>

                </template>
            </div>
        </div>
        <!-- Footer -->
        <div slot="footer">
            <div class="slds-text-body_small slds-text-color_weak">
                Enterprise Edition | Data Explorer
            </div>
        </div>

    </lightning-card>
</template>
