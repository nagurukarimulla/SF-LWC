<template>
    <lightning-card title="Opportunity Onboarding" icon-name="standard:process">
        <div class="slds-p-around_medium">
            
            <!-- Opportunity Lookup - Always visible at the top -->
            <div class="slds-m-bottom_medium">
                <lightning-record-picker
                    label="Select Opportunity to Onboard"
                    placeholder="Search for an opportunity..."
                    object-api-name="Opportunity"
                    value={selectedOpportunityId}
                    onchange={handleOpportunityChange}
                    required>
                </lightning-record-picker>
            </div>

            <!-- Show message if no opportunity selected -->
            <template if:false={selectedOpportunityId}>
                <div class="slds-align_absolute-center slds-m-vertical_large">
                    <p>Please select an opportunity to begin</p>
                </div>
            </template>

            <!-- Loading State -->
            <template if:true={selectedOpportunityId}>
                <template if:true={isLoading}>
                    <div class="slds-align_absolute-center slds-m-vertical_large">
                        <lightning-spinner alternative-text="Fetching Preview..." size="small"></lightning-spinner>
                        <p class="slds-m-left_small">Fetching deal details...</p>
                    </div>
                </template>

                <!-- Preview Data -->
                <template if:false={isLoading}>
                    <template if:true={previewData}>
                        <template if:false={isCompleted}>
                            <div class="slds-m-bottom_medium">
                                <p class="slds-text-heading_small slds-m-bottom_small">
                                    Onboarding Preview for: <strong>{previewData.oppName}</strong>
                                </p>
                                
                                <div class="slds-box slds-theme_shade">
                                    <ul class="slds-list_vertical slds-has-dividers_bottom-space">
                                        <li class="slds-item">
                                            Account: <strong>{previewData.accountName}</strong>
                                        </li>
                                        <li class="slds-item">
                                            Assigned Owner: <strong>{previewData.ownerName}</strong>
                                        </li>
                                        <li class="slds-item">
                                            Deal Amount: <strong>${previewData.amount}</strong>
                                        </li>
                                    </ul>
                                </div>

                                <p class="slds-m-top_medium slds-text-color_weak">
                                    This will create a 12-month contract and a follow-up task.
                                </p>
                            </div>
<template if:true={previewData.warningMessage}>
    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-m-top_medium" role="alert">
        <span class="slds-assistive-text">warning</span>
        <span class="slds-icon_container slds-icon-utility-warning slds-m-right_x-small">
            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
        </span>
        <h2>{previewData.warningMessage}</h2>
    </div>
</template>
                            <lightning-button 
                                variant="brand" 
                                label="Start Onboarding" 
                                icon-name="utility:play"
                                onclick={handleOnboard}
                                disabled={disableOnboarding}>
                            </lightning-button>
                        </template>
                    </template>

                    <!-- Error State -->
                    <template if:true={error}>
                        <div class="slds-text-color_error slds-m-top_medium">
                            <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                            <span class="slds-m-left_xx-small">{error}</span>
                        </div>
                    </template>
                </template>
            </template>

            <!-- Success State -->
            <template if:true={isCompleted}>
                <div class="slds-box slds-theme_success slds-theme_alert-texture slds-m-top_medium">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="action:approval" size="small" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-text-heading_small">Onboarding Complete!</h2>
                            <p>The Account has been updated and a Task has been linked to the new Contract.</p>
                        </div>
                    </div>
                </div>
                <div class="slds-m-top_medium">
                    <lightning-button label="Onboard Another Opportunity" onclick={handleReset}></lightning-button>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
