<template>
    <div class="slds-container slds-container_center slds-p-around_medium">
        <!-- Header -->
        <div class="slds-page-header">
            <h1 class="slds-page-header__title">{componentTitle}</h1>
            <p class="slds-text-body_small">
                connectedCallback() & disconnectedCallback() - Enterprise Implementation
            </p>
        </div>

        <!-- Connection Status Card -->
        <div class="slds-box slds-m-top_medium">
            <div class="slds-grid slds-grid_align-spread">
                <h2 class="slds-text-heading_medium">Connection Status</h2>
                <span class={connectionBadge}>{connectionText}</span>
            </div>
            
            <div class="slds-grid slds-m-top_medium">
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name={statusIcon} size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-text-heading_small">{totalConnections}</div>
                            <div class="slds-text-body_small">Times Connected</div>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:time" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-text-heading_small">{timeInDOM}</div>
                            <div class="slds-text-body_small">Time in DOM</div>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:event" size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-text-heading_small">{lastActionText}</div>
                            <div class="slds-text-body_small">Last Action</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Subscriptions Status -->
        <div class="slds-card slds-m-top_medium">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title">Active Subscriptions & Listeners</h2>
            </div>
            <div class="slds-card__body slds-p-around_medium">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col">
                        <div class="slds-text-title_caps">Message Channel</div>
                        <div class={messageChannelClass}>
                            {messageChannelText}
                        </div>
                    </div>
                    <div class="slds-col">
                        <div class="slds-text-title_caps">Resize Listener</div>
                        <div class={resizeListenerClass}>
                            {resizeListenerText}
                        </div>
                    </div>
                    <div class="slds-col">
                        <div class="slds-text-title_caps">Visibility Listener</div>
                        <div class={visibilityListenerClass}>
                            {visibilityListenerText}
                        </div>
                    </div>
                    <div class="slds-col">
                        <div class="slds-text-title_caps">Polling</div>
                        <div class={pollingClass}>
                            {pollingText}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Best Practices Grid -->
        <div class="slds-grid slds-m-top_medium">
            <div class="slds-col slds-p-horizontal_small">
                <div class="slds-card">
                    <div class="slds-card__header">
                        <h2 class="slds-text-heading_small slds-text-color_success">✅ connectedCallback() DO's</h2>
                    </div>
                    <div class="slds-card__body slds-p-around_small">
                        <ul class="slds-list_dotted">
                            <template for:each={connectedCallbackDos} for:item="item">
                                <li key={item}>{item}</li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-p-horizontal_small">
                <div class="slds-card">
                    <div class="slds-card__header">
                        <h2 class="slds-text-heading_small slds-text-color_error">❌ connectedCallback() DON'Ts</h2>
                    </div>
                    <div class="slds-card__body slds-p-around_small">
                        <ul class="slds-list_dotted">
                            <template for:each={connectedCallbackDonts} for:item="item">
                                <li key={item}>{item}</li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="slds-grid slds-m-top_medium">
            <div class="slds-col slds-p-horizontal_small">
                <div class="slds-card">
                    <div class="slds-card__header">
                        <h2 class="slds-text-heading_small slds-text-color_success">🧹 disconnectedCallback() MUST DO's</h2>
                    </div>
                    <div class="slds-card__body slds-p-around_small">
                        <ul class="slds-list_dotted">
                            <template for:each={disconnectedCallbackDos} for:item="item">
                                <li key={item}>{item}</li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="slds-col slds-p-horizontal_small">
                <div class="slds-card slds-theme_warning">
                    <div class="slds-card__header">
                        <h2 class="slds-text-heading_small">⚠️ Critical: Memory Leak Prevention</h2>
                    </div>
                    <div class="slds-card__body slds-p-around_small">
                        <p>Always clean up in disconnectedCallback:</p>
                        <ul class="slds-list_dotted slds-m-top_small">
                            <li>Intervals & Timeouts</li>
                            <li>Event Listeners</li>
                            <li>Observers</li>
                            <li>Subscriptions</li>
                            <li>Cache References</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Event Logs -->
        <div class="slds-card slds-m-top_medium">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title">Lifecycle Event Logs</h2>
            </div>
            <div class="slds-card__body">
                <div class="slds-scrollable_y" style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered" style="min-width:900px;">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Phase</th>
                                <th>Level</th>
                                <th>Message</th>
                                <th>Data</th>
                             </tr>
                        </thead>
                        <tbody>
                            <template for:each={eventLogs} for:item="log">
                                <tr key={log.id}>
                                    <td>{log.timestamp}</td>
                                        <td>
                                            <span class={log.phaseClass}>
                                            {log.phase}
                                        </span>
                                    </td>
                                    <td>
                                        <span class={log.levelClass}>
                                            {log.level}
                                        </span>
                                    </td>
                                    <td>
                                        <div class="slds-truncate" title={log.message}>
                                            {log.message}
                                        </div>
                                    </td>
                                    <td>
                                        <template if:true={log.data}>
                                            <button class="slds-button slds-button_icon" 
                                                    onclick={handleShowData} 
                                                    data-id={log.id}>
                                                <lightning-icon icon-name="utility:preview" size="xx-small"></lightning-icon>
                                            </button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Interactive Controls -->
        <div class="slds-card slds-m-top_medium">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title">Interactive Testing</h2>
            </div>
            <div class="slds-card__body slds-p-around_medium">
                <div class="slds-grid slds-gutters">
                    <div class="slds-col">
                        <lightning-button label="Simulate Reconnection" 
                                          onclick={handleSimulateReconnection}
                                          variant="brand">
                        </lightning-button>
                    </div>
                    <div class="slds-col">
                        <lightning-button label={pollingButtonLabel} 
                                          onclick={handleTogglePolling}
                                          variant="neutral">
                        </lightning-button>
                    </div>
                    <div class="slds-col">
                        <lightning-button label="Clear Logs" 
                                          onclick={handleClearLogs}
                                          variant="destructive-text">
                        </lightning-button>
                    </div>
                </div>
                
                <div class="slds-m-top_medium slds-text-color_weak slds-border_top slds-p-top_medium">
                    <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                    <span class="slds-m-left_x-small">
                        💡 connectedCallback() can fire multiple times (reordering, moving in DOM). 
                        Always implement proper cleanup in disconnectedCallback() to prevent memory leaks.
                    </span>
                </div>
            </div>
        </div>
    </div>
    <template if:true={showDataModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Log Data</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <pre class="slds-text-body_small" style="white-space:pre-wrap;">{modalData}</pre>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Close</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
