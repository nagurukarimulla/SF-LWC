<template>
    <div class="slds-p-around_medium">
        <lightning-card title="Transaction Finalizer Demo - Account Creator">
            <!-- Description -->
            <div class="slds-p-horizontal_medium slds-m-bottom_small">
                <p class="slds-text-body_regular">
                    This demo shows how Transaction Finalizers work:
                </p>
                <ul class="slds-list_dotted slds-m-left_medium slds-m-top_x-small">
                    <li>Queueable job creates 5 accounts (50% chance to fail)</li>
                    <li>Finalizer captures logs and handles retries automatically</li>
                    <li>Max retries: 2 attempts</li>
                </ul>
            </div>

            <!-- Actions -->
            <div class="slds-p-horizontal_medium slds-m-bottom_small">
                <lightning-button 
                    label="Start Job" 
                    variant="brand" 
                    onclick={startJob}
                    disabled={isProcessing}>
                </lightning-button>
                
                <lightning-button 
                    label="Clear Logs" 
                    variant="neutral" 
                    onclick={clearLogs}
                    class="slds-m-left_small">
                </lightning-button>
            </div>

            <!-- Progress Indicator -->
            <template if:true={isProcessing}>
                <div class="slds-p-horizontal_medium">
                    <lightning-spinner alternative-text="Processing" size="medium">
                    </lightning-spinner>
                    <p class="slds-text-align_center">Job is running... Check debug logs for details</p>
                </div>
            </template>

            <!-- Log Display -->
            <div class="slds-p-horizontal_medium slds-m-top_medium">
                <lightning-tabset>
                    <lightning-tab label="Execution Logs">
                        <div class="slds-p-vertical_small">
                            <template if:true={logs.length}>
                                <div class="slds-text-color_error slds-m-bottom_small">
                                    Check Developer Console → Debug Logs for complete details
                                </div>
                                <div class="slds-scrollable_y" style="height: 300px;">
                                    <template for:each={logs} for:item="log">
                                        <div key={log.id} class="slds-m-bottom_xx-small">
                                            <span class="slds-text-body_small">[{log.timestamp}]</span>
                                            <span class="slds-m-left_x-small">{log.message}</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:false={logs.length}>
                                <div class="slds-text-align_center slds-text-color_weak">
                                    No logs yet. Click "Start Job" to begin.
                                </div>
                            </template>
                        </div>
                    </lightning-tab>
                    
                    <lightning-tab label="How It Works">
                        <div class="slds-p-vertical_small">
                            <h3 class="slds-text-heading_small slds-m-bottom_small">
                                Transaction Finalizer Pattern
                            </h3>
                            
                            <h4 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">
                                📝 Key Concepts:
                            </h4>
                            <ul class="slds-list_styled">
                                <li><strong>Queueable + Finalizer in same class</strong> - Implements both interfaces</li>
                                <li><strong>attachFinalizer(this)</strong> - Attaches itself for post-processing</li>
                                <li><strong>FinalizerContext</strong> - Provides job result and exception details</li>
                                <li><strong>Automatic retry logic</strong> - Re-enqueues failed jobs up to 2 times</li>
                                <li><strong>State preservation</strong> - logs array persists even after failure</li>
                            </ul>

                            <h4 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">
                                🔄 Execution Flow:
                            </h4>
                            <ol class="slds-list_styled">
                                <li>User clicks "Start Job" → Job enqueued</li>
                                <li>Queueable job attaches finalizer</li>
                                <li>Job executes (creates accounts)</li>
                                <li>If success → Finalizer logs completion</li>
                                <li>If failure → Finalizer captures exception and retries</li>
                                <li>Retry counter prevents infinite loops</li>
                            </ol>

                            <h4 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">
                                💡 Best Practices Shown:
                            </h4>
                            <ul class="slds-list_styled">
                                <li>Track retry attempts to avoid infinite loops</li>
                                <li>Preserve state (logs) across retries</li>
                                <li>Handle both success and failure scenarios</li>
                                <li>Use try-catch to capture errors properly</li>
                            </ul>
                        </div>
                    </lightning-tab>
                </lightning-tabset>
            </div>
        </lightning-card>
    </div>
</template>
