<template>
    <lightning-card
        title="event.target vs event.currentTarget"
        icon-name="utility:hierarchy">
        <div class="slds-p-around_medium">
                <div class="container" onclick={handleContainerClick} data-id="container">
                    <lightning-button variant = "brand"
                        label="Action A"
                        data-id="A">
                    </lightning-button>
                    <lightning-button variant = "Success"
                        label="Action B"
                        data-id="B">
                    </lightning-button>
                    <lightning-button variant="brand-outline"
                        label="Action C"
                        data-id="C">
                    </lightning-button>
                </div>
                <div class="slds-m-top_medium">
                    <p><strong>Target:</strong> {targetInfo}</p>
                    <p><strong>CurrentTarget:</strong> {currentTargetInfo}</p>
                    <p><strong>event.target.dataset.id:</strong> {targetDatasetId}</p>
                    <p><strong>event.currentTarget.dataset.id:</strong> {currentTargetDatasetId}</p>
                </div>
            </div>
    </lightning-card>
</template>
